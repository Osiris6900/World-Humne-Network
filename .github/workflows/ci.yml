name: Core and interoperability

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - name: Check fixture regeneration
        run: |
          cargo run --locked --quiet --example print_vectors > /tmp/cards-v0.json
          diff -u test-vectors/cards-v0.json /tmp/cards-v0.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-interop.txt
      - run: python scripts/verify_vectors.py
