[package]
name = "whn-core"
version = "0.1.0"
edition = "2021"
description = "World-Humne-Network protocol core: identity, cards, signing (spec draft v0.1)"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Osiris6900/World-Humne-Network"

[dependencies]
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "1"
